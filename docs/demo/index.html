<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tidewater — plan releases together</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
        color: #111827;
        background: #fafaf9;
      }
      .site-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 18px 64px; border-bottom: 1px solid #e7e5e4; background: #fff;
      }
      .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; }
      .logo-mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #0ea5e9, #6366f1); }
      .nav { display: flex; gap: 32px; font-size: 15px; color: #374151; }
      .nav a { color: inherit; text-decoration: none; }
      .btn { border-radius: 10px; padding: 10px 18px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
      .btn-ghost { background: #fff; border: 1px solid #d6d3d1; color: #111827; }
      .btn-primary { background: #111827; border: 1px solid #111827; color: #fff; }
      .hero { padding: 72px 64px 48px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 48px; align-items: center; }
      .eyebrow { display: inline-block; font-size: 13px; font-weight: 600; color: #4f46e5; background: #eef2ff; padding: 4px 10px; border-radius: 999px; }
      .hero-heading { font-size: 54px; line-height: 1.08; letter-spacing: -0.03em; margin: 18px 0 20px; font-weight: 700; }
      .hero-heading .muted { color: #9ca3af; }
      .hero-copy { font-size: 18px; color: #4b5563; max-width: 520px; margin: 0 0 28px; }
      .hero-actions { display: flex; gap: 12px; }
      .board { background: #fff; border: 1px solid #e7e5e4; border-radius: 16px; padding: 18px; box-shadow: 0 20px 40px -24px rgba(17,24,39,.25); }
      .board-title { font-size: 13px; font-weight: 600; color: #6b7280; margin-bottom: 12px; }
      .task { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #f0efee; border-radius: 10px; margin-bottom: 8px; font-size: 14px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; }
      .tag { margin-left: auto; font-size: 12px; color: #6b7280; }
      .features { padding: 0 64px 64px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
      .feature-card { background: #fff; border: 1px solid #e7e5e4; border-radius: 16px; padding: 22px; }
      .feature-art { height: 92px; border-radius: 12px; margin-bottom: 16px; }
      .feature-card h3 { margin: 0 0 6px; font-size: 17px; }
      .feature-card p { margin: 0; font-size: 14px; color: #6b7280; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/dist/app.js"></script>
  </body>
</html>
